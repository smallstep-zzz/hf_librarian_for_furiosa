[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hf-librarian-for-furiosa"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["huggingface_hub>=1.0,<2", "json5>=0.9"]

[project.scripts]
hf-librarian = "hf_librarian.cli:main"

[tool.setuptools.package-data]
hf_librarian = ["catalog.json"]

[tool.setuptools]
packages = ["hf_librarian"]
